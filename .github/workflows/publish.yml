name: Publish to PyPI

# Publishes when a MAJOR.MINOR.PATCH tag (e.g. 0.6.0) is pushed. The tag
# becomes the package version via setuptools_scm. After the upload, a GitHub
# release is made with that version's section of CHANGELOG.md.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: CHANGELOG.md has a section for this version
        run: grep -q "^## $GITHUB_REF_NAME " CHANGELOG.md
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/swindl/
    permissions:
      id-token: write  # PyPI trusted publishing, no API token needed
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to create the release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$GITHUB_REF_NAME" '/^## /{p = ($2 == v)} p && !/^## /' CHANGELOG.md > notes.md
          if ! grep -q . notes.md; then
            echo "See [CHANGELOG.md](https://github.com/seecr/swindl/blob/master/CHANGELOG.md)." > notes.md
          fi
      - run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
