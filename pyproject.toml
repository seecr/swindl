[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "swindl"
authors = [
    {name = "Thijs Janssen", email = "thijs@seecr.nl"},
    {name = "Johan Jonkers", email = "johan@seecr.nl"},
]
description = "Seecr Web Index and Database Lib combines swl, sil and sdbl"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["swl", "sil", "sdbl", "seecr"]
license = {file = "LICENSE"}
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "pytest >= 9.2.0, < 10",
    "pytest-asyncio >= 1.4.1, < 2",
    "pytest-xdist >= 3.8.0, < 4",
    "seecr-sil >= 3.4.0, < 4",
    "seecr-stdlib >= 0.6.5, < 1",
    "setuptools-scm >= 10.3.4, < 11",
    "sjdbl >= 0.4.0, < 1",
]
dynamic = ["version"]

[project.scripts]
swindl-load-sdbl-dump = "swindl.store.dump:main"
swindl-check = "swindl.check:main"

[tool.setuptools_scm]
version_file = "swindl/_version.py"

[tool.setuptools.packages.find]
where = ["."]
include = ["swindl*"]

[tool.setuptools]
include-package-data = true

[tool.isort]
profile = "black"

[tool.pytest]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
filterwarnings = [
    "ignore::DeprecationWarning:importlib._bootstrap",
]
addopts = ["-n5"]

