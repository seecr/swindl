[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "swindl"
authors = [
    {name = "Thijs Janssen", email = "thijs@seecr.nl"},
    {name = "Johan Jonkers", email = "johan@seecr.nl"},
]
description = "Seecr Web Index and Database Lib combines swl, sil and sdbl"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["swl", "sil", "sdbl", "seecr"]
license = {file = "LICENSE"}
classifiers = [
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "pytest >= 9.0.3, < 10",
    "pytest-asyncio >= 1.3.0, < 2",
    "sdbl >= 1.2.3, < 2",
    "setuptools-scm >= 10.0.5, < 11",
    "sil >= 0.5.1, < 1",
    "swl >= 2.8.9, < 3",
]
dynamic = ["version"]

[tool.setuptools_scm]
version_file = "swindl/_version.py"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools]
include-package-data = true

[tool.isort]
profile = "black"

[tool.pytest]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
filterwarnings = [
    "ignore::DeprecationWarning:importlib._bootstrap",
]
addopts = ["-n5"]

